<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#27F293" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#27F293" />
    <meta name="color-scheme" content="dark" />
    
    <!-- Prevent Aggressive Browser Caching of Entrypoint -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- SEO Meta Tags -->
    <title>Nexus — AI Models, Agents, and Workflows</title>
    <meta name="description" content="Build, run, and discover intelligent tools. Nexus brings AI models, agents, workflows, and verifiable payments into one accessible workspace." />
    
    <!-- SPA redirect decoder for GitHub Pages Hash Router -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + '/#' + decoded + l.hash
          );
        } else if (l.search.slice(1, 3) === 'p=') {
          var decoded = l.search.slice(3).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + '/#/' + decoded.replace(/^\//, '') + l.hash
          );
        }
      }(window.location));
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Funnel+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-sans selection:bg-emerald-500/30 selection:text-white antialiased min-h-screen flex flex-col">
    <div id="root" class="flex-1 flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
